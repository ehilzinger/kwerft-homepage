# Returns portal for the web shop
services:
  returns:
    image: ghcr.io/example-shop/returns:1.4.0
    command: ["node", "server.js"]
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://returns:${DB_PASSWORD}@returns-db:5432/returns
      REDIS_URL: redis://returns-cache:6379
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      LABEL_PRINTER: zebra
    depends_on: [returns-db, returns-cache]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
  returns-worker:
    image: ghcr.io/example-shop/returns:1.4.0
    command: ["node", "worker.js"]
    environment:
      DATABASE_URL: postgres://returns:${DB_PASSWORD}@returns-db:5432/returns
      REDIS_URL: redis://returns-cache:6379
    depends_on: [returns-db]
  returns-db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: returns
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - returns-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "returns"]
  returns-cache:
    image: redis:8.10.2-alpine
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
volumes:
  returns-data:
    x-kwerft: {size: 20Gi}
