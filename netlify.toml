[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Same policy as the console: everything from this origin, nothing inline.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pages build as <name>.html; /docs is also a directory, so name its page.
[[redirects]]
  from = "/docs"
  to = "/docs.html"
  status = 200

# The advertised installer URL. 302, not 301, so the target can change later.
# /<version>/install.sh pins a release (kwerft-install keeps one per tag).
[[redirects]]
  from = "/install.sh"
  to = "https://raw.githubusercontent.com/ehilzinger/kwerft-install/main/install.sh"
  status = 302

[[redirects]]
  from = "/:version/install.sh"
  to = "https://raw.githubusercontent.com/ehilzinger/kwerft-install/main/:version/install.sh"
  status = 302

# One address for search engines: the Netlify subdomain moves to kwerft.dev
# (deploy previews have their own subdomains and are not affected).
[[redirects]]
  from = "https://kwerft.netlify.app/*"
  to = "https://kwerft.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kwerft.dev/*"
  to = "https://kwerft.dev/:splat"
  status = 301
  force = true

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
